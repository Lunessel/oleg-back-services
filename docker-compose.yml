services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oleg
      POSTGRES_PASSWORD: oleg
      POSTGRES_DB: oleg
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oleg -d oleg"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.api.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://oleg:oleg@db:5432/oleg
      MEDIA_DIR: /app/media
    ports:
      - "8000:8000"
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  bot:
    build: .
    command: python -m app.bot.main
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://oleg:oleg@db:5432/oleg
      MEDIA_DIR: /app/media
    volumes:
      - media:/app/media
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  media:
